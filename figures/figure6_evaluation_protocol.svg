<svg viewBox="0 0 680 482" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, sans-serif">
<title>Evaluation protocol with linear-ceiling control</title>
<desc>Identical DE features evaluated under LOSO by both a logistic-regression ceiling and AM-DGCN, then compared by paired t and Wilcoxon tests</desc>
<style>
.t14{font-size:14px;font-weight:500}
.t12{font-size:12px}
.t11{font-size:11px}
.ed{stroke:#5F5E5A;stroke-width:1.2;fill:none}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="240" y="40" width="200" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="64" text-anchor="middle" dominant-baseline="central" class="t14" fill="#444441">DE features (identical)</text>
<rect x="60" y="130" width="240" height="64" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="180" y="150" text-anchor="middle" dominant-baseline="central" class="t14" fill="#0C447C">Linear ceiling</text>
<text x="180" y="170" text-anchor="middle" dominant-baseline="central" class="t11" fill="#185FA5">logistic regression · LOSO</text>
<rect x="380" y="130" width="240" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="500" y="150" text-anchor="middle" dominant-baseline="central" class="t14" fill="#085041">AM-DGCN</text>
<text x="500" y="170" text-anchor="middle" dominant-baseline="central" class="t11" fill="#0F6E56">multi-scale GNN · LOSO</text>
<path class="ed" d="M300 88 L300 110 L180 110 L180 130" marker-end="url(#ar)"/>
<path class="ed" d="M380 88 L380 110 L500 110 L500 130" marker-end="url(#ar)"/>
<path class="ed" d="M180 194 L180 250" marker-end="url(#ar)"/>
<path class="ed" d="M500 194 L500 250" marker-end="url(#ar)"/>
<rect x="180" y="250" width="320" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="270" text-anchor="middle" dominant-baseline="central" class="t14" fill="#3C3489">LOSO · paired by held-out subject</text>
<text x="340" y="290" text-anchor="middle" dominant-baseline="central" class="t11" fill="#534AB7">per-subject accuracy, n = 15–32</text>
<path class="ed" d="M340 306 L340 330" marker-end="url(#ar)"/>
<rect x="180" y="330" width="320" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="350" text-anchor="middle" dominant-baseline="central" class="t14" fill="#3C3489">paired t · Wilcoxon signed-rank</text>
<text x="340" y="370" text-anchor="middle" dominant-baseline="central" class="t11" fill="#534AB7">two-sided, α = .05</text>
<path class="ed" d="M340 386 L340 410" marker-end="url(#ar)"/>
<rect x="80" y="410" width="520" height="52" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="340" y="436" text-anchor="middle" dominant-baseline="central" class="t14" fill="#0C447C">Advantage over the ceiling is significant but bounded (≤ 12.4 pp)</text>
</svg>
